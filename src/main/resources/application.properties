# Reads STRIPE_SECRET_KEY etc. from the same .env file the Python version uses
spring.config.import=optional:file:.env[.properties]

server.port=8000

# File-based H2 database (the Java equivalent of SQLite for this POC)
spring.datasource.url=jdbc:h2:file:./payments
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
